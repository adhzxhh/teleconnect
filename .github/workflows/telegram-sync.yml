name: Sync Telegram Channel

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Telegram posts
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python sync_telegram.py

      - name: Commit updated content
        run: |
          git config user.name "telegram-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.json telegram_state.json
          git diff --cached --quiet || git commit -m "Sync Telegram content"
          git push
