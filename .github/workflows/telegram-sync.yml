name: Sync Telegram Channel

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sync_telegram.py'
      - '.github/workflows/telegram-sync.yml'

permissions:
  contents: write

concurrency:
  group: telegram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Sync Telegram posts
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python sync_telegram.py

      - name: Commit updated content and downloads
        run: |
          git config user.name "telegram-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.json telegram_state.json downloads/
          git diff --cached --quiet || git commit -m "Sync Telegram content"
          git push
